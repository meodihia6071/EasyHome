server:
  port: 8081
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/easyhome;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
  jackson:
    serialization:
      write-dates-as-timestamps: false
app:
  jwt-secret: ${JWT_SECRET:easyhome-local-demo-only-secret-change-before-deploy-2026}
  seed-demo: ${APP_SEED_DEMO:true}
  mock-payments: ${APP_MOCK_PAYMENTS:true}
