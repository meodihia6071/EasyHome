server:
  port: 8081
spring:
  datasource:
    url: ${DB_URL:jdbc:mariadb://127.0.0.1:3306/easyhome}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.mariadb.jdbc.Driver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
  jackson:
    serialization:
      write-dates-as-timestamps: false
app:
  jwt-secret: ${JWT_SECRET:easyhome-local-demo-only-secret-change-before-deploy-2026}
  seed-demo: ${APP_SEED_DEMO:true}
  mock-payments: ${APP_MOCK_PAYMENTS:true}
